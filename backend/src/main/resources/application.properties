# ASKİ Water Outage Notification System
# Application Configuration

spring.application.name=aski-notification-system

# Server Configuration
server.port=8080

# Database Configuration (H2 for Development)
spring.datasource.url=jdbc:h2:mem:askidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Development only)
spring.h2-console.enabled=true
spring.h2-console.path=/h2-console

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application Properties
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.aski-url=https://www.aski.gov.tr/tr/Kesinti.aspx

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.askitracker=DEBUG
logging.level.org.springframework.mail=DEBUG
